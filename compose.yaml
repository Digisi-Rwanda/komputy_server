# Local stack for the engine. `make dev` starts what's missing; the web app's Postgres (ecl-web-pg :5440) is reused
# when present, otherwise the `postgres` profile provides one.
services:
  minio:  # S3 API stand-in for Cloudflare R2
    image: minio/minio:latest  # shortcut: unpinned for local dev only; R2 in prod
    command: server /data --console-address ":9011"
    environment: { MINIO_ROOT_USER: komputy, MINIO_ROOT_PASSWORD: komputy-secret, MINIO_API_CORS_ALLOW_ORIGIN: "*" }
    ports: ["9010:9000", "9011:9011"]
    volumes: [minio:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }
  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    environment: { POSTGRES_USER: komputy, POSTGRES_PASSWORD: komputy, POSTGRES_DB: komputy }
    ports: ["5440:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]
volumes: { minio: {}, pg: {} }
