# Lint + full test suite (domain maths and integration against Postgres 17 + MinIO), then a production image build.
# Render deploys `main` only after this passes (autoDeployTrigger: checksPass).
name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: komputy, POSTGRES_PASSWORD: komputy, POSTGRES_DB: komputy_engine_test }
        ports: ["5440:5432"]
        options: --health-cmd "pg_isready -U komputy" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: "Naming and punctuation guard: no em/en dashes, no pre-rebrand names"
        run: |
          if git grep -nI -e $'\u2014' -e $'\u2013' -e 'Ledgerline' -e 'ECL Platform' -- . ':!*.lock' ':!package-lock.json' ':!uv.lock' ':!design/**' ':!docs/REBRAND_PLAN.md'; then
            echo "Found em/en dashes or old product names (see docs/REBRAND_PLAN.md in komputy_server)"; exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, prune-cache: false }  # moto (uv tool) keeps the cache locked until the job ends
      - name: S3 stand-in for R2 (moto; the MinIO image is no longer on Docker Hub)
        run: |
          uv tool run --from 'moto[server]==5.1.4' moto_server -H 127.0.0.1 -p 9010 > moto.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:9010/ > /dev/null && break; sleep 1; done
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
        env: { STORAGE_REGION: us-east-1 }  # moto rejects R2's "auto"
      - name: Production image builds
        run: docker build -t komputy-engine:ci . && docker build -t komputy-backup:ci ops/backup
