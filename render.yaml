# Komputy production on Render (Frankfurt). Infrastructure as code: see docs/DEPLOYMENT_PLAN.md.
# Web app: github.com/mugisham37/komputy_web · Engine: this repo. Everything talks over Render's private network;
# only komputy-web is public. Secrets marked `sync: false` are set once at approval and never live in git.

envVarGroups:
  # Shared by web + engine: the web app's ops token must equal the engine's SERVICE_TOKEN.
  - name: komputy-shared
    envVars:
      - key: SERVICE_TOKEN
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
  # Cloudflare R2 (scoped account token → S3 keys). Engine services + backup cron.
  - name: komputy-storage
    envVars:
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_PUBLIC_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET_NAME
        value: komputy-prod
      - key: BACKUP_BUCKET_NAME
        value: komputy-backups
  # Scheduled HTTP jobs authenticate to the web app with this.
  - name: komputy-cron
    envVars:
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: komputy-db
    databaseName: komputy
    user: komputy
    plan: basic-4gb
    diskSizeGB: 50
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []  # private network only

services:
  - type: keyvalue
    name: komputy-kv
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction  # sessions and rate-limit counters must never be evicted
    ipAllowList: []

  # ── Web (Next.js): the only public service ──────────────────────────────────────────────
  - type: web
    name: komputy-web
    runtime: node
    repo: https://github.com/mugisham37/komputy_web
    branch: main
    region: frankfurt
    plan: standard
    numInstances: 1
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run predeploy  # web migrations + first-admin bootstrap (idempotent)
    startCommand: npm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: komputy-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: komputy-kv, property: connectionString }
      - key: ENGINE_HOSTPORT
        fromService: { type: pserv, name: komputy-engine-api, property: hostport }
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        sync: false  # Fernet key (urlsafe base64, 32 bytes)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Ledgerline <no-reply@komputy.com>
      - key: DB_POOL_MAX
        value: "10"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - fromGroup: komputy-shared
      - fromGroup: komputy-cron

  # ── Engine API (private: reachable only from the web app) ──────────────────────────────
  - type: pserv
    name: komputy-engine-api
    runtime: docker
    repo: https://github.com/mugisham37/komputy_server
    branch: main
    region: frankfurt
    plan: standard
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: sh scripts/predeploy.sh  # Alembic + queue schema, before new code takes traffic
    autoDeployTrigger: checksPass
    envVars: &engine_env
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase: { name: komputy-db, property: connectionString }
      - key: WEB_HOSTPORT
        fromService: { type: web, name: komputy-web, property: hostport }
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: MAX_CONCURRENT_RUNS_PER_TENANT
        value: "2"
      - key: WEB_CONCURRENCY
        value: "2"
      - fromGroup: komputy-shared
      - fromGroup: komputy-storage

  # ── Workers: io (validation, ingest, exports, imports, housekeeping) ───────────────────
  - type: worker
    name: komputy-worker-io
    runtime: docker
    repo: https://github.com/mugisham37/komputy_server
    branch: main
    region: frankfurt
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: procrastinate --app=ledgerline.queue.app worker --queues=io --concurrency=4
    maxShutdownDelaySeconds: 300  # let in-flight jobs finish on deploys
    autoDeployTrigger: checksPass
    envVars: *engine_env

  # ── Workers: calc (ECL compute, lease books): large memory, one job at a time ──────────
  - type: worker
    name: komputy-worker-calc
    runtime: docker
    repo: https://github.com/mugisham37/komputy_server
    branch: main
    region: frankfurt
    plan: pro
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: procrastinate --app=ledgerline.queue.app worker --queues=calc --concurrency=1
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: checksPass
    envVars: *engine_env

  # ── Scheduled jobs (private network → web app) ─────────────────────────────────────────
  - type: cron
    name: komputy-cron-events
    runtime: image
    image: { url: docker.io/curlimages/curl:8.11.1 }
    region: frankfurt
    plan: starter
    schedule: "* * * * *"
    dockerCommand: sh -c 'curl -fsS -m 50 -X POST -H "Authorization: Bearer $CRON_SECRET" "http://$WEB_HOSTPORT/api/cron/events"'
    envVars: &cron_env
      - key: WEB_HOSTPORT
        fromService: { type: web, name: komputy-web, property: hostport }
      - fromGroup: komputy-cron
  - type: cron
    name: komputy-cron-expire
    runtime: image
    image: { url: docker.io/curlimages/curl:8.11.1 }
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    dockerCommand: sh -c 'curl -fsS -m 240 -X POST -H "Authorization: Bearer $CRON_SECRET" "http://$WEB_HOSTPORT/api/cron/expire"'
    envVars: *cron_env
  - type: cron
    name: komputy-cron-daily
    runtime: image
    image: { url: docker.io/curlimages/curl:8.11.1 }
    region: frankfurt
    plan: starter
    schedule: "0 6 * * *"  # 08:00 Africa/Kigali
    dockerCommand: sh -c 'curl -fsS -m 600 -X POST -H "Authorization: Bearer $CRON_SECRET" "http://$WEB_HOSTPORT/api/cron/daily"'
    envVars: *cron_env
  - type: cron
    name: komputy-cron-backup
    runtime: docker
    repo: https://github.com/mugisham37/komputy_server
    branch: main
    region: frankfurt
    plan: starter
    schedule: "0 1 * * *"
    dockerfilePath: ./ops/backup/Dockerfile
    dockerContext: ./ops/backup
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: komputy-db, property: connectionString }
      - fromGroup: komputy-storage
